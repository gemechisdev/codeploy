version: 2

# go:embed all:dist (internal/webui/embed.go) needs a built SPA before any Go build.
# This hook also runs for `goreleaser build`, so the released binaries embed the current UI.
before:
  hooks:
    # VITE_API_MODE=live is explicit here (it is also the SPA default) so a released binary can never
    # accidentally embed the in-browser mock. Matches the CI web job's build.
    - sh -c 'cd web && npm ci && VITE_API_MODE=live npm run build && cd .. && rm -rf internal/webui/dist && mkdir -p internal/webui/dist && cp -r web/dist/. internal/webui/dist/ && touch internal/webui/dist/.gitkeep'

# `goreleaser build --clean` writes the binaries straight into dist/ under the exact names
# deploy/install.sh downloads. no_unique_dist_dir + a templated binary name avoid GoReleaser's
# per-target subdirectories, so `make dist-pack` can package THESE binaries instead of
# rebuilding them (release.yml passes DIST_FROM_GORELEASER=1).
# Archives and GoReleaser's own checksum file are deliberately absent: `goreleaser build`
# produces binaries only, and the installer wants raw binaries plus one GNU sha256sum
# checksums.txt covering both architectures and the five static assets. `make dist-pack`
# owns that file; release.yml signs it with cosign.
builds:
  - id: codeplod
    main: ./cmd/codeplod
    binary: "codeplod_linux_{{ .Arch }}"
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/codeplo/codeplo/internal/app.Version={{ .Version }} -X github.com/codeplo/codeplo/internal/app.Commit={{ .ShortCommit }} -X github.com/codeplo/codeplo/internal/app.BuiltAt={{ .Date }}
  - id: codeplo
    main: ./cmd/codeplo
    binary: "codeplo_linux_{{ .Arch }}"
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/codeplo/codeplo/internal/app.Version={{ .Version }} -X github.com/codeplo/codeplo/internal/app.Commit={{ .ShortCommit }} -X github.com/codeplo/codeplo/internal/app.BuiltAt={{ .Date }}
