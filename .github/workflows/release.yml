name: release
on:
  push:
    tags: ['v*']
permissions:
  id-token: write
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      # .goreleaser.yaml's before.hooks build the SPA and stage it for go:embed. GoReleaser then
      # writes codeplod_linux_{amd64,arm64} and codeplo_linux_{amd64,arm64} directly into dist/
      # (no_unique_dist_dir), so these are the binaries the installer will download.
      - name: GoReleaser multi-arch build
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: build --clean
      # Reuse the GoReleaser binaries (never delete or rebuild them), add the five static assets
      # and build the 9-line checksums.txt (both arch binaries + five assets) in GNU sha256sum format.
      - name: Assemble installer artefacts and checksums.txt
        run: make dist-pack DIST_FROM_GORELEASER=1
      - uses: sigstore/cosign-installer@v3
      - name: Keyless-sign checksums.txt (OIDC identity pinned)
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt
          # Exact identity assertion: the signature is only valid for this repo's release workflow
          # on this tag, which is what the installer pins via CODEPLO_COSIGN_IDENTITY.
          cosign verify-blob \
            --certificate dist/checksums.txt.pem \
            --signature dist/checksums.txt.sig \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt
      - name: Upload all assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
