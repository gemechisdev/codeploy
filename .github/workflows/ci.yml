name: ci
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      # jsdom 30 pulls undici 8, which calls zlib.createZstdDecompress at module load
      # and therefore needs Node >= 22.19.0. Node 20 kills every vitest forks worker
      # before a single test runs. Keep this in lockstep with web/.nvmrc.
      - uses: actions/setup-node@v4
        with: { node-version-file: web/.nvmrc, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Node toolchain guard
        working-directory: web
        run: node -e "const w=require('fs').readFileSync('.nvmrc','utf8').trim();if(process.versions.node!==w){console.error('expected Node '+w+' (jsdom/undici need >=22.22.2), got '+process.versions.node);process.exit(1)}console.log('node '+w)"
      - run: pip install pyyaml
      - name: install web deps
        run: cd web && npm ci
      - name: lint
        run: make lint
      - name: test (includes the authz matrix in test/authz)
        run: go test -race ./...
      - name: authz matrix
        run: go test ./test/authz/... -run TestEveryRouteDeclaresOnePermission -count=1
      - name: OpenAPI vs generated drift check
        run: |
          make gen-check
          git diff --exit-code -- web/src/api/schema.d.ts internal/api/stubs_gen.go internal/api/oapigen
          test -z "$(git status --porcelain -- internal/api/oapigen)"
      - name: build (embeds web/dist)
        run: make build
  # T66: native arm64 runner (available on public repos). For private repos use docker/setup-qemu-action
  # + buildx to run the same commands under a linux/arm64 QEMU container.
  go-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./...
      - run: GOARCH=arm64 CGO_ENABLED=0 go build ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: web/.nvmrc, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Node toolchain guard
        working-directory: web
        run: node -e "const w=require('fs').readFileSync('.nvmrc','utf8').trim();if(process.versions.node!==w){console.error('expected Node '+w+' (jsdom/undici need >=22.22.2), got '+process.versions.node);process.exit(1)}console.log('node '+w)"
      - run: cd web && npm ci
      - run: cd web && npm run lint
      # check:mock-free / check:external / check:size all read dist/, so the live build comes first.
      - run: cd web && VITE_API_MODE=live npm run build
      - run: cd web && npm run check:mock-free
      - run: cd web && npm run check:external
      - run: cd web && npm run check:size
      - run: cd web && npm test -- --run
