    get:
      operationId: listBackupRuns
      summary: Backup runs
      tags:
      - backups
      x-permission: backup:manage
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRunPage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /backups/{id}/run:
    post:
      operationId: runBackup
      summary: Run schedule now
      tags:
      - backups
      x-permission: backup:manage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRun'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /backups/{id}/restore:
    post:
      operationId: restoreBackup
      summary: Restore (step-up; pre-restore snapshot)
      tags:
      - backups
      x-permission: backup:restore
      x-step-up: true
      description: May respond `403 step_up_required`; the client opens the step-up dialog and retries once.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResult'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /templates:
    get:
      operationId: listTemplates
      summary: Template catalog
      tags:
      - templates
      x-permission: template:deploy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateList'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /templates/{key}/deploy:
    post:
      operationId: deployTemplate
      summary: Deploy template
      tags:
      - templates
      x-permission: template:deploy
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployTemplateRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResourceResponse'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '409':
          $ref: '#/components/responses/E409'
  /webhooks/github:
    post:
      operationId: receiveGithubWebhook
      tags:
      - git
      summary: Server-side only (HMAC-SHA256 + delivery-ID dedupe). Not called by the UI.
      x-permission: public
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
  /hooks/deploy/{token}:
    post:
      operationId: receiveDeployHook
      tags:
      - git
      summary: Server-side only (token in path, hashed at rest). Not called by the UI.
      x-permission: public
      security: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                image:
                  type: string
                digest:
                  type: string
              additionalProperties: false
              required:
              - image
      responses:
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-codeplo
      description: HttpOnly session cookie. Loopback bootstrap listener uses `codeplo_session` (plan 3.12).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on every non-GET request; value from GET /auth/me.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
          - unauthenticated
          - forbidden
          - step_up_required
          - validation_failed
          - conflict
          - not_found
          - rate_limited
          - module_disabled
          - preflight_failed
          - internal
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      additionalProperties: false
      required:
      - code
      - message
    Permission:
      type: string
      enum:
      - resource:read
      - resource:write
      - resource:delete
      - resource:control
      - deploy:create
      - deploy:cancel
      - deploy:rollback
      - env:read
      - env:write
      - domain:write
      - project:write
      - terminal:host
      - terminal:root
      - terminal:container
      - hardening:read
      - hardening:apply
      - edge:read
      - edge:reconcile
      - git:write
      - hook:manage
      - audit:read
      - users:manage
      - tokens:manage
      - modules:manage
      - flags:manage
      - system:read
      - system:metrics
      - system:cleanup
      - notify:manage
      - backup:manage
      - backup:restore
      - template:deploy
    Role:
      type: object
      properties:
        key:
          type: string
          enum:
          - owner
          - admin
          - deployer
          - viewer
        name:
          type: string
        builtin:
          type: boolean
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
      additionalProperties: false
      required:
      - key
      - name
      - builtin
      - permissions
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - owner
          - admin
          - deployer
          - viewer
        totp_enabled:
          type: boolean
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
      additionalProperties: false
      required:
      - id
      - email
      - role
      - totp_enabled
      - disabled
      - created_at
      - last_login_at
    Me:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        role:
          type: string
          enum:
          - owner
          - admin
          - deployer
          - viewer
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        step_up_until:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        csrf_token:
          type: string
        server_now:
          type: string
          format: date-time
        bootstrap:
          type: boolean
      additionalProperties: false
      required:
      - user
      - role
      - permissions
      - step_up_until
      - csrf_token
      - server_now
      - bootstrap
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      additionalProperties: false
      required:
      - email
      - password
    LoginResponse:
