openapi: 3.1.0
info:
  title: codeplo API
  version: 1.2.0
  description: OpenAPI-first contract for codeplod. JSON, snake_case, ISO-8601 UTC timestamps, opaque ULID ids. Includes the
    v1.2 amendments listed in docs/CONTRACT.md.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: /api/v1
security:
- cookieAuth: []
  csrfHeader: []
tags:
- name: audit
  description: audit operations
- name: auth
  description: auth operations
- name: backups
  description: backups operations
- name: deployments
  description: deployments operations
- name: edge
  description: edge operations
- name: events
  description: events operations
- name: feature-flags
  description: feature-flags operations
- name: git
  description: git operations
- name: hardening
  description: hardening operations
- name: modules
  description: modules operations
- name: notifications
  description: notifications operations
- name: permissions
  description: permissions operations
- name: projects
  description: projects operations
- name: resources
  description: resources operations
- name: roles
  description: roles operations
- name: settings
  description: settings operations
- name: setup
  description: setup operations
- name: system
  description: system operations
- name: templates
  description: templates operations
- name: terminal
  description: terminal operations
- name: tokens
  description: tokens operations
- name: users
  description: users operations
- name: webhooks
  description: webhooks operations
paths:
  /setup/state:
    get:
      operationId: getSetupState
      summary: Setup state
      tags:
      - setup
      x-permission: public
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupState'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
  /setup/admin:
    post:
      operationId: createSetupAdmin
      summary: Create owner (needs one-time token; works once)
      tags:
      - setup
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupAdminRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
  /setup/totp/enroll:
    post:
      operationId: enrollSetupTotp
      summary: Begin TOTP enrollment
      tags:
      - setup
      x-permission: public
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollment'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
  /setup/totp/verify:
    post:
      operationId: verifySetupTotp
      summary: Verify TOTP, return recovery codes once
      tags:
      - setup
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
  /setup/verify-domain:
    post:
      operationId: verifySetupDomain
      summary: DNS check for the panel domain
      tags:
      - setup
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyDomainRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyDomainResult'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
  /setup/panel-domain:
    post:
      operationId: setPanelDomain
      summary: Add panel domain route; nothing switches until issuance succeeds
      tags:
      - setup
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PanelDomainRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelDomainResult'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '501':
          $ref: '#/components/responses/E501'
  /setup/operator-candidates:
    get:
      operationId: listOperatorCandidates
      summary: Existing sudo users
      tags:
      - setup
      x-permission: public
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorCandidates'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
  /setup/operator:
    post:
      operationId: setOperator
      summary: Select or create operator identity
      tags:
      - setup
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetOperatorRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorCandidate'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '501':
          $ref: '#/components/responses/E501'
  /setup/complete:
    post:
      operationId: completeSetup
      summary: Finish the wizard; setup endpoints are disabled afterwards
      tags:
      - setup
      x-permission: public
      security: []
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
  /auth/login:
    post:
      operationId: login
      summary: Password login
      tags:
      - auth
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
  /auth/totp/verify:
    post:
      operationId: verifyTotp
      summary: Complete login with TOTP
      tags:
      - auth
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpVerifyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
  /auth/step-up:
    post:
      operationId: stepUp
      summary: TOTP step-up
      tags:
      - auth
      x-permission: session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpResponse'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
  /auth/logout:
    post:
      operationId: logout
      summary: Logout
      tags:
      - auth
      x-permission: session
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
  /auth/me:
    get:
      operationId: getMe
      summary: Current session
      tags:
      - auth
      x-permission: session
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
  /users:
    get:
      operationId: listUsers
      summary: List users
      tags:
      - users
      x-permission: users:manage
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque keyset cursor (last item id); omit for the first page.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
    post:
      operationId: createUser
      summary: Create user
      tags:
      - users
      x-permission: users:manage
      x-step-up: true
      description: May respond `403 step_up_required`; the client opens the step-up dialog and retries once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '409':
          $ref: '#/components/responses/E409'
  /users/{id}:
    patch:
      operationId: patchUser
      summary: Update user
      tags:
      - users
      x-permission: users:manage
      x-step-up: true
      description: May respond `403 step_up_required`; the client opens the step-up dialog and retries once.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
  /tokens:
    get:
      operationId: listTokens
      summary: List API tokens
      tags:
      - tokens
      x-permission: tokens:manage
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque keyset cursor (last item id); omit for the first page.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
    post:
      operationId: createToken
      summary: Create token (secret returned once)
      tags:
      - tokens
      x-permission: tokens:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCreated'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '409':
          $ref: '#/components/responses/E409'
  /tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke token
      tags:
      - tokens
      x-permission: tokens:manage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /roles:
    get:
      operationId: listRoles
      summary: Roles with permissions
      tags:
      - roles
      x-permission: session
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /permissions:
    get:
      operationId: listPermissions
      summary: Permission registry
      tags:
      - permissions
      x-permission: session
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionList'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /audit:
    get:
      operationId: listAudit
      summary: Audit events
      tags:
      - audit
      x-permission: audit:read
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: actor
        in: query
        required: false
        schema:
          type: string
      - name: action
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /audit/verify:
    post:
      operationId: verifyAudit
      summary: Verify hash chain server-side (tamper-evident)
      tags:
      - audit
      x-permission: audit:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResult'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /hardening/checks:
    get:
      operationId: listHardeningChecks
      summary: Checks with status, score, apply_enabled
      tags:
      - hardening
      x-permission: hardening:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardeningChecks'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /hardening/audit:
    post:
      operationId: runHardeningAudit
      summary: Read-only audit (zero mutations)
      tags:
      - hardening
      x-permission: hardening:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardeningChecks'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /hardening/plan:
    post:
      operationId: planHardening
      summary: Plan diffs and commands
      tags:
      - hardening
      x-permission: hardening:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardeningPlan'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '409':
          $ref: '#/components/responses/E409'
  /hardening/preflight:
    post:
      operationId: preflightHardening
      summary: Preflight for a Tier 2/3 check
      tags:
      - hardening
      x-permission: hardening:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreflightRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightResult'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '409':
          $ref: '#/components/responses/E409'
  /hardening/apply:
    post:
      operationId: applyHardening
      summary: Apply (Tier 1-3); step-up required
      tags:
      - hardening
      x-permission: hardening:apply
      x-step-up: true
      description: May respond `403 step_up_required`; the client opens the step-up dialog and retries once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardeningChange'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '409':
          $ref: '#/components/responses/E409'
  /hardening/confirm/{changeId}:
    post:
      operationId: confirmHardening
      summary: Confirm connectivity
      tags:
      - hardening
      x-permission: hardening:apply
      parameters:
      - name: changeId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardeningChange'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /hardening/revert/{changeId}:
    post:
      operationId: revertHardening
      summary: Revert now
      tags:
      - hardening
      x-permission: hardening:apply
      parameters:
      - name: changeId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardeningChange'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /hardening/runs:
    get:
      operationId: listHardeningRuns
      summary: Run history
      tags:
      - hardening
      x-permission: hardening:read
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardeningRunPage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
