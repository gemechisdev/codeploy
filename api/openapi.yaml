    E403:
      description: forbidden | step_up_required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E404:
      description: not_found | module_disabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E409:
      description: conflict | preflight_failed (details.checks)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E422:
      description: validation_failed (details.fields)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E429:
      description: rate_limited (Retry-After header)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E501:
      description: module_disabled (step arrives in a later phase)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
